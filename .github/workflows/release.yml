name: Build release

# Triggers:
#   - push of a tag like v1.2.3  -> build .exe and attach to a GitHub Release
#   - manual workflow_dispatch    -> build .exe and upload as workflow artifact
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # needed by softprops/action-gh-release to create releases

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: >
          pyinstaller --onefile --windowed
          --icon=assets/icon.ico
          --add-data "assets/icon.ico;assets"
          --name CheckListChecker
          main.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CheckListChecker-${{ github.ref_name }}
          path: dist/CheckListChecker.exe
          retention-days: 30

      - name: Attach to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CheckListChecker.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
